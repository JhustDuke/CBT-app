<!-- =========================
     Modal Overlay
========================= -->
<div
	id="ext-actionModal"
	style="
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		display: flex;
		align-items: center;
		justify-content: center;
		z-index: 2147483647;
		font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue',
			'Noto Sans', 'Liberation Sans', Arial, sans-serif;
		font-size: 1rem;
		font-weight: 400;
		line-height: 1.5;
		color: #212529;
	">
	<!-- =========================
         Modal Container
    ========================= -->
	<div
		style="
			position: relative;
			display: flex;
			flex-direction: column;
			gap: 1rem;
			width: 360px;
			padding: 1.5rem;
			background-color: #fff;
			border: 1px solid #dee2e6;
			border-radius: 0.375rem;
			box-sizing: border-box;
		">
		<!-- =========================
             Passport Preview Section
        ========================= -->
		<div
			style="
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
			">
			<img
				id="ext-passportImage"
				src="#"
				alt="No pics available"
				style="
					width: 100px;
					height: 120px;
					max-width: 100%;
					border: 2px solid #000;
					vertical-align: middle;
					box-sizing: border-box;
				" />

			<!-- =========================
                 Counter
            ========================= -->
			<div
				id="ext-enrolCounter"
				style="
					text-align: center;
					font-weight: 700;
					color: rgba(33, 37, 41, 0.75);
				"
				>0 / 0</div
			>

			<button
				id="modalDownloadBtn"
				style="
					display: inline-block;
					margin: 0;
					padding: 0.25rem 0.5rem;
					font-family: inherit;
					font-size: 0.875rem;
					font-weight: 400;
					line-height: 1.5;
					text-align: center;
					text-decoration: none;
					vertical-align: middle;
					cursor: pointer;
					user-select: none;
					color: #fff;
					background-color: #198754;
					border: 1px solid #198754;
					border-radius: 0.25rem;
				"
				disabled>
				Download Image
			</button>
		</div>

		<!-- =========================
             Status Select
        ========================= -->
		<h5
			style="
				margin-top: 1rem;
				margin-bottom: 0.5rem;
				font-size: 1.25rem;
				font-weight: 500;
				line-height: 1.2;
			">
			Select Status
		</h5>
		<select
			id="ext-statusSelect"
			style="
				display: block;
				width: 100%;
				margin: 0;
				padding: 0.375rem 2.25rem 0.375rem 0.75rem;
				font-family: inherit;
				font-size: 1rem;
				font-weight: 400;
				line-height: 1.5;
				color: #212529;
				background-color: #fff;
				background-image: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3e%3cpath fill=%27none%27 stroke=%27%23343a40%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke-width=%272%27 d=%27m2 5 6 6 6-6%27/%3e%3c/svg%3e');
				background-repeat: no-repeat;
				background-position: right 0.75rem center;
				background-size: 16px 12px;
				border: 1px solid #dee2e6;
				border-radius: 0.375rem;
				appearance: none;
				box-sizing: border-box;
			">
			<option value="success">Success</option>
			<option value="error">Error</option>
		</select>

		<!-- =========================
             Error Reason
        ========================= -->
		<div style="margin-top: 0.5rem; margin-bottom: 0.5rem">
			<input
				type="text"
				id="ext-errorReason"
				placeholder="type in reason"
				style="
					display: block;
					width: 100%;
					margin: 0;
					padding: 0.375rem 0.75rem;
					font-family: inherit;
					font-size: 1rem;
					font-weight: 400;
					line-height: 1.5;
					color: #212529;
					background-color: #fff;
					border: 1px solid #dee2e6;
					border-radius: 0.375rem;
					appearance: none;
					box-sizing: border-box;
				" />

			<p
				id="errorText"
				style="
					margin-top: 0;
					margin-bottom: 1rem;
					color: #dc3545;
					display: none;
					width: 100%;
				">
				supply error reason (5 chars min)
			</p>
		</div>

		<!-- =========================
             Action Buttons
        ========================= -->
		<div
			style="
				display: flex;
				justify-content: flex-end;
				gap: 0.5rem;
				margin-top: 1rem;
			">
			<button
				id="ext-submitStatusBtn"
				style="
					display: inline-block;
					margin: 0;
					padding: 0.375rem 0.75rem;
					font-family: inherit;
					font-size: 1rem;
					font-weight: 400;
					line-height: 1.5;
					text-align: center;
					text-decoration: none;
					vertical-align: middle;
					cursor: pointer;
					user-select: none;
					color: #fff;
					background-color: #dc3545;
					border: 1px solid #dc3545;
					border-radius: 0.375rem;
				"
				>Submit</button
			>
			<button
				id="ext-closeModalBtn"
				style="
					display: inline-block;
					margin: 0;
					padding: 0.375rem 0.75rem;
					font-family: inherit;
					font-size: 1rem;
					font-weight: 400;
					line-height: 1.5;
					text-align: center;
					text-decoration: none;
					vertical-align: middle;
					cursor: pointer;
					user-select: none;
					color: #fff;
					background-color: #6c757d;
					border: 1px solid #6c757d;
					border-radius: 0.375rem;
				"
				>Close</button
			>
		</div>

		<!-- =========================
             Prev Button
        ========================= -->
		<button
			id="ext-prevBtn"
			style="
				position: absolute;
				top: 50%;
				left: 1px;
				transform: translateY(-50%);
				display: inline-block;
				margin: 0;
				padding: 0.25rem;
				font-family: inherit;
				font-size: 1rem;
				font-weight: 400;
				line-height: 1.5;
				text-align: center;
				text-decoration: none;
				cursor: pointer;
				user-select: none;
				color: #fff;
				background-color: #000;
				border: 1px solid transparent;
				border-radius: 0.375rem;
			"
			>prev</button
		>

		<!-- =========================
             Next Button
        ========================= -->
		<button
			id="ext-nextBtn"
			style="
				position: absolute;
				top: 50%;
				right: 1px;
				transform: translateY(-50%);
				display: inline-block;
				margin: 0;
				padding: 0.25rem;
				font-family: inherit;
				font-size: 1rem;
				font-weight: 400;
				line-height: 1.5;
				text-align: center;
				text-decoration: none;
				cursor: pointer;
				user-select: none;
				color: #fff;
				background-color: #000;
				border: 1px solid transparent;
				border-radius: 0.375rem;
			"
			>next</button
		>
	</div>
</div>
