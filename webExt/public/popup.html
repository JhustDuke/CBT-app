<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>JAMB/CBT MOCK</title>
		<link
			rel="shortcut icon"
			href="/"
			type="image/x-icon" />
		<link
			rel="stylesheet"
			href="css/popup.css" />
		<!-- jQuery CDN -->
		<!-- <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> -->
	</head>
	<body class="w-100">
		<div>
			<!-- SIMULATION SITES -->
			<a
				href="https://cbt-app-fu42.onrender.com/"
				target="_blank"
				>simulation site-</a
			>
		</div>
		<!-- app -->
		<div
			id="app"
			class="grey lighten-4">
			<center class="grey lighten-3 p-3">
				<h3 class="fw-bold text-capitalize w-50">JAMB CBT HELPER</h3>
			</center>
			<div
				style="width: 400px; height: 400px"
				class="container">
				<div class="p-3">
					<button
						id="fetchDataBtn"
						class="btn btn-primary w-100 mb-3"
						>Click to receive data</button
					>

					<!-- fetch outcome -->
					<div
						id="fetchOutcome"
						class="border p-3"
						style="min-height: 150px">
						<div
							id="fetchPlaceholder"
							class="text-muted text-center">
							Received data would show here
						</div>

						<div
							id="fetchLoading"
							class="d-none text-center">
							<div
								class="spinner-border"
								role="status"></div>
							<div>Receiving...</div>
						</div>

						<div
							id="fetchError"
							class="d-none text-danger"></div>

						<div
							id="fetchResult"
							class="d-none">
							<p
								id="receivedCount"
								class="fw-bold"></p>
							<div
								id="receivedCards"
								class="d-flex flex-column gap-2"
								style="max-height: 200px; overflow-y: auto"></div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script
			src="popup.js"
			type="module"></script>
	</body>
</html>
